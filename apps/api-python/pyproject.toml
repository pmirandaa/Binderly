[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binderly-api-python"
version = "0.0.0"
description = "Binderly Python services — embeddings, ANN index builds, grading, pricing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "UNLICENSED" }
authors = [{ name = "Binderly" }]
# Base runtime deps — what every consumer of the `embeddings` module
# needs to LOAD an existing TFLite model and run inference against it.
# `ai-edge-litert` is Google's modern, lightweight TFLite runtime
# (the maintained successor to `tflite-runtime`, which stopped
# publishing wheels for Python 3.12+). It's ~5 MB versus full
# TensorFlow's ~500 MB. CI installs only this set.
dependencies = [
  "ai-edge-litert==2.1.5",
  "numpy>=1.26,<2.1",
  "Pillow>=10.0,<12.0",
  "pydantic>=2.6,<3.0",
  # grading/centering — OpenCV for card-edge + inner-border detection.
  # The headless variant excludes the ~40 MB GUI dependencies.
  "opencv-python-headless>=4.9,<5.0",
  # grading/scrapers/{psa,ebay,auctions} — shared HTTP client + HTML/JSON parsers.
  # httpx: async-capable, rate-limited; beautifulsoup4 + lxml: HTML parsing.
  "httpx>=0.27,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "lxml>=5.0,<6.0",
]

[project.optional-dependencies]
# Only needed by `embeddings/scripts/build_tflite.py` — the offline
# Keras → TFLite converter. CI does NOT install this set; the build
# script runs once locally per model bump.
build = [
  "tensorflow==2.18.1",
]
# Test + lint extras.
# `onnx` + `onnxruntime` are added here for the grading/ml_common ONNX
# export round-trip tests (T-GR-CORNERS). Both are lightweight (~1-10 MB)
# compared to torch (~2 GB), so they are appropriate in CI dev deps.
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  # grading/ml_common — ONNX export + inference round-trip tests.
  # onnx: builds ONNX graphs for the numpy linear model export path.
  # onnxruntime: CPU inference session for the round-trip test.
  "onnx>=1.16,<2.0",
  "onnxruntime>=1.18,<2.0",
]
# Real CNN training deps — NOT installed in CI.  Run `make train` with
# CORNERS_USE_TORCH=1 after installing this group.
# `torch + torchvision` provide the MobileNetV3-small backbone used in
# production training (see grading/corners/model.py for the upgrade path).
ml = [
  "torch>=2.0,<3.0",
  "torchvision>=0.15,<1.0",
]

[project.scripts]
binderly-build-tflite = "embeddings.scripts.build_tflite:main"
binderly-build-card-embeddings = "embeddings.scripts.build_card_embeddings:main"
binderly-embeddings-smoke = "embeddings.scripts.smoke:main"
binderly-build-ann-index = "ann.scripts.build_ann_index:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["embeddings*", "ann*", "grading*", "grading.scrapers*", "grading.ml_common*", "grading.corners*"]
exclude = ["embeddings.tests*", "ann.tests*", "grading.*.tests*", "grading.scrapers.*.tests*"]

[tool.setuptools.package-data]
"embeddings" = ["py.typed"]
"ann" = ["py.typed"]
"grading" = ["py.typed"]
"grading.centering" = ["py.typed"]
"grading.ml_common" = ["py.typed"]
"grading.corners" = ["py.typed"]
"grading.scrapers" = ["py.typed"]
"grading.scrapers.psa" = ["py.typed"]
"grading.scrapers.ebay" = ["py.typed", "fixtures/*.json"]
"grading.scrapers.auctions" = ["py.typed"]
"grading.scrapers.auctions._shared" = ["py.typed"]
"grading.scrapers.auctions.pwcc" = ["py.typed", "fixtures/*.html"]
"grading.scrapers.auctions.goldin" = ["py.typed", "fixtures/*.html"]
"grading.aggregate" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = [
  "embeddings/tests",
  "ann/tests",
  "grading/centering/tests",
  "grading/ml_common/tests",
  "grading/corners/tests",
  "grading/surface/tests",
  "grading/aggregate/tests",
  "grading/scrapers/psa/tests",
  "grading/scrapers/ebay/tests",
  "grading/scrapers/auctions/tests",
  "grading/scrapers/auctions/pwcc/tests",
  "grading/scrapers/auctions/goldin/tests",
]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
]
