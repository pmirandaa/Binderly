# dependencies.yaml — Binderly build graph
#
# Source of truth for task readiness, ownership, and parallelism.
# Only the orchestrator agent edits this file.
#
# Status values: pending | in_progress | in_review | merged | blocked
# Effort: S (≤2h) | M (~half day) | L (~full day)
# stub: true means task file is a placeholder and must be elaborated before
#   dispatch (see AGENT_ORCHESTRATOR.md § 5).

config:
  max_parallel: 3
  default_branch: main
  branch_prefix: agent/

tasks:
  # ============================================================
  # PHASE 0 — FOUNDATION (mostly serial)
  # ============================================================
  - id: T-FN-MONOREPO
    stage: 00-foundation
    title: Initialize Turborepo monorepo with pnpm
    agent_role: devops
    status: merged
    depends_on: []
    parallel_safe_with: []
    provides: [monorepo:scaffold]
    owns_paths: [package.json, pnpm-workspace.yaml, turbo.json, .gitignore, .nvmrc]
    task_file: tasks/00-foundation/T-FN-MONOREPO.md
    est_effort: S

  - id: T-FN-TS-CONFIG
    stage: 00-foundation
    title: Shared TypeScript config package
    agent_role: devops
    status: merged
    depends_on: [T-FN-MONOREPO]
    parallel_safe_with: [T-FN-LINT-CONFIG]
    provides: [config:typescript]
    owns_paths: [packages/config/tsconfig/]
    task_file: tasks/00-foundation/T-FN-TS-CONFIG.md
    est_effort: S

  - id: T-FN-LINT-CONFIG
    stage: 00-foundation
    title: Shared ESLint + Prettier config
    agent_role: devops
    status: merged
    depends_on: [T-FN-MONOREPO]
    parallel_safe_with: [T-FN-TS-CONFIG]
    provides: [config:lint]
    owns_paths: [packages/config/eslint/, packages/config/prettier/]
    task_file: tasks/00-foundation/T-FN-LINT-CONFIG.md
    est_effort: S

  - id: T-FN-GITHUB
    stage: 00-foundation
    title: GitHub repo, branch protection, PR template
    agent_role: devops
    status: merged
    depends_on: [T-FN-MONOREPO]
    parallel_safe_with: [T-FN-TS-CONFIG, T-FN-LINT-CONFIG]
    provides: [github:repo]
    owns_paths: [.github/]
    task_file: tasks/00-foundation/T-FN-GITHUB.md
    est_effort: S

  - id: T-FN-CI
    stage: 00-foundation
    title: GitHub Actions CI skeleton (lint, typecheck, test)
    agent_role: devops
    status: merged
    depends_on: [T-FN-MONOREPO, T-FN-TS-CONFIG, T-FN-LINT-CONFIG, T-FN-GITHUB]
    parallel_safe_with: []
    provides: [ci:skeleton]
    owns_paths: [.github/workflows/]
    task_file: tasks/00-foundation/T-FN-CI.md
    est_effort: M

  - id: T-FN-DOCKER
    stage: 00-foundation
    title: Docker Compose for local dev (Postgres, MinIO, Mailpit)
    agent_role: devops
    status: blocked
    depends_on: [T-FN-MONOREPO]
    parallel_safe_with: [T-FN-TS-CONFIG, T-FN-LINT-CONFIG, T-FN-GITHUB]
    provides: [infra:local-docker]
    owns_paths: [infra/docker-compose.yml, infra/docker/, .env.example]
    task_file: tasks/00-foundation/T-FN-DOCKER.md
    est_effort: M
    blocked_on: Q-002

  - id: T-FN-SUPABASE-LOCAL
    stage: 00-foundation
    title: Supabase local dev via supabase-cli
    agent_role: devops
    status: pending
    depends_on: [T-FN-DOCKER]
    parallel_safe_with: []
    provides: [infra:supabase-local]
    owns_paths: [infra/supabase/]
    task_file: tasks/00-foundation/T-FN-SUPABASE-LOCAL.md
    est_effort: M

  - id: T-FN-DB-MIGRATIONS
    stage: 00-foundation
    title: Drizzle ORM + migration tooling
    agent_role: backend
    status: pending
    depends_on: [T-FN-SUPABASE-LOCAL, T-FN-TS-CONFIG]
    parallel_safe_with: []
    provides: [db:migrations]
    owns_paths: [packages/db/package.json, packages/db/drizzle.config.ts, packages/db/src/index.ts, packages/db/src/client.ts]
    task_file: tasks/00-foundation/T-FN-DB-MIGRATIONS.md
    est_effort: M

  - id: T-FN-ORCHESTRATOR-SCRIPTS
    stage: 00-foundation
    title: Worktree spawn/cleanup scripts and orchestrator config
    agent_role: devops
    status: merged
    depends_on: [T-FN-GITHUB]
    parallel_safe_with: [T-FN-DOCKER, T-FN-CI]
    provides: [orchestrator:scripts]
    owns_paths: [scripts/spawn_worktree.sh, scripts/cleanup_worktree.sh, scripts/orchestrator.config.json, scripts/README.md]
    task_file: tasks/00-foundation/T-FN-ORCHESTRATOR-SCRIPTS.md
    est_effort: S

  - id: T-FN-ENV-CONVENTIONS
    stage: 00-foundation
