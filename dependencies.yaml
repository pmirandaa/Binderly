    agent_role: devops
    status: pending
    depends_on: [T-FN-DOCKER]
    parallel_safe_with: [T-FN-SUPABASE-LOCAL, T-FN-ORCHESTRATOR-SCRIPTS]
    provides: [config:env]
    owns_paths: [.env.example, docs/env.md]
    task_file: tasks/00-foundation/T-FN-ENV-CONVENTIONS.md
    est_effort: S

