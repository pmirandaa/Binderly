# Always-on CI for the Binderly monorepo.
#
# Job names `lint`, `typecheck`, `test`, `build` are LOAD-BEARING — they are
# wired into branch protection on `main` per docs/github-setup.md § 3.
# Renaming any of them silently breaks the required-status-check enforcement.
#
# Action pinning policy (T-FN-CI):
#   - Every `uses:` is pinned to a major-version tag (per task spec).
#   - Digest pinning across the repo is a separate hardening pass; when it
#     happens, replace the tag with `@<sha>` and keep the tag in a comment.
#
# Security note: this workflow uses `pull_request` (NOT `pull_request_target`)
# per rules/00-foundation.md hard rules.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs on a PR when new commits land; never cancel `main` or
# manual runs (we want their full history).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Turbo remote cache — env-only wiring per T-FN-CI spec.
  # No signup required at this stage; uncomment + provision the secrets once a
  # Vercel/Turbo team is set up. Until then, Turbo falls back to local cache
  # (which the pnpm-store cache below already accelerates across runs).
  # TURBO_TOKEN: ${{ secrets.CI_TURBO_TOKEN }}
  # TURBO_TEAM: ${{ secrets.CI_TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack and activate pinned pnpm
        # `packageManager: pnpm@9.15.9` in package.json (T-FN-MONOREPO) is the
        # source of truth; `corepack prepare` here makes the version explicit
        # so a corepack regression on the runner cannot silently downgrade it.
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version
      - name: Resolve pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack and activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version
      - name: Resolve pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack and activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version
      - name: Resolve pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack and activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version
      - name: Resolve pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Build web with no env (smoke guard, #FU-11)
        # Reproduce the env-less production build deterministically: the
        # web app must build with zero NEXT_PUBLIC_* / SUPABASE_* vars
        # (lazy-init pattern). Catches eager module/render-time env reads
        # before they break a real deploy. Workspace deps are already
        # built by the `Build` step above, so this only re-runs `next
        # build` for apps/web with a stripped environment.
        run: pnpm --filter @binderly/web build:no-env
