# CI for the Python package(s) under `apps/api-python/`.
#
# This workflow is separate from `ci.yml` because:
#   - The JS pipeline (lint / typecheck / test / build) runs on every
#     PR via pnpm; bringing Python into that path would make every PR
#     pay the Python interpreter + pip-install tax even for pure JS
#     diffs.
#   - The Python package is excluded from `pnpm-workspace.yaml`
#     (see `apps/api-python/README.md`) so turbo / pnpm scripts cannot
#     see it. A dedicated workflow is the cleanest way to wire it in.
#
# This workflow installs ONLY the runtime + dev extras — NOT the
# `build` extras (which pull in full TensorFlow). The tests use a
# pre-committed tiny TFLite fixture (~2 KB) so they don't need TF at
# runtime. The full Keras → TFLite conversion is run manually with
# `pip install -e '.[build]' && binderly-build-tflite ...` when a new
# production model is needed.
#
# Path filter: skip on JS-only PRs to keep the runner queue light.
# Trigger on changes to the Python tree or to this workflow itself.

name: CI / Python

on:
  pull_request:
    paths:
      - "apps/api-python/**"
      - ".github/workflows/ci-python.yml"
  push:
    branches: [main]
    paths:
      - "apps/api-python/**"
      - ".github/workflows/ci-python.yml"
  workflow_dispatch:

concurrency:
  group: ci-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python-tests:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api-python/pyproject.toml

      - name: Install runtime + dev extras
        run: |
          python -m pip install --upgrade pip
          # Install only the runtime + dev extras. The `build` extras
          # (full TensorFlow) are NOT installed here — see header.
          pip install -e '.[dev]'

      - name: Run pytest
        env:
          # Quiet TF / abseil noise just in case any tests transitively
          # import it later. The current suite does not.
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: pytest -q
